name: Test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dalamud dev libraries
        shell: pwsh
        run: |
          $dalamudHome = "$env:GITHUB_WORKSPACE/.dalamud"
          New-Item -ItemType Directory -Force -Path $dalamudHome | Out-Null
          $versionInfo = Invoke-RestMethod -Uri "https://kamori.goats.dev/Dalamud/Release/VersionInfo"
          $zipPath = Join-Path $env:RUNNER_TEMP "dalamud.zip"
          Invoke-WebRequest -Uri $versionInfo.downloadUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $dalamudHome -Force
          $devPath = Get-ChildItem -Path $dalamudHome -Recurse -Directory -Filter dev | Select-Object -First 1
          if (-not $devPath) { throw "Could not find Dalamud dev folder in downloaded archive." }
          echo "DALAMUD_HOME=$($devPath.FullName)" >> $env:GITHUB_ENV
          echo "DalamudLibPath=$($devPath.FullName)" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test DcNotify.sln -c Release --collect:"XPlat Code Coverage"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: "**/coverage.cobertura.xml"
